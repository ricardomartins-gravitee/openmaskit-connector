[project]
name = "openmaskit-connector"
version = "0.1.0a3"
description = "Portable local MCP connector and private relay for OpenMaskit"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "mcp>=1.27,<3",
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.38,<1",
    "httpx>=0.28,<1",
    "websockets>=15,<17",
    "pydantic>=2.12,<3",
]

[project.scripts]
openmaskit-connector = "openmaskit_connector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hatchling>=1.27,<2",
    "pip-audit>=2.10.1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=7.1.0",
    "respx>=0.22,<1",
    "ruff>=0.17.1",
]
bundle = ["pyinstaller>=6.16,<7"]
intel-build = [
    "cffi>=2.1.1",
    "maturin>=1.14.1,<2",
    "packaging>=26",
    "setuptools>=82",
]
release-build = [
    "hatchling>=1.27,<2",
]

[tool.hatch.build.targets.sdist]
only-include = ["LICENSE", "README.md", "pyproject.toml", "src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/openmaskit_connector"]

[tool.coverage.report]
fail_under = 80
show_missing = true
