name: Build Intel cryptography wheel

on:
  workflow_call:
    inputs:
      source-ref:
        description: Connector revision whose source and lockfile are built
        required: false
        type: string
        default: ''
    outputs:
      build-key:
        value: ${{ jobs.wheel.outputs.build-key }}

permissions:
  contents: read
  attestations: read
  actions: read

jobs:
  wheel:
    name: Build and verify Intel dependency
    runs-on: macos-15-intel
    timeout-minutes: 30
    outputs:
      build-key: ${{ steps.restore.outputs.build-key }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      OPENSSL_STATIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ricardomartins-gravitee/openmaskit-connector
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: 'false'
      - name: Install only locked binary build tools
        run: uv sync --frozen --no-build --python 3.12 --only-group intel-build
      - name: Restore the matching attested native library if published
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --no-sync --no-build python scripts/intel_wheel.py restore "$RUNNER_TEMP/intel-wheel"
      - name: Download and verify locked upstream source
        run: uv run --frozen --no-sync --no-build python scripts/intel_wheel.py fetch "$RUNNER_TEMP/crypto-build"
      - name: Scan locked upstream dependencies
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/crypto-build/source
          version: v0.70.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/trivy-report.json
          hide-progress: 'true'
      - name: Print redacted upstream scan summary
        if: always()
        run: python3 scripts/security_report.py "$RUNNER_TEMP/trivy-report.json"
      - name: Download and verify pinned OpenSSL LTS source
        if: steps.restore.outputs.reused != 'true'
        run: uv run --frozen --no-sync --no-build python scripts/intel_wheel.py fetch-openssl "$RUNNER_TEMP/openssl-build"
      - name: Build and test the native libraries only when no matching release exists
        if: steps.restore.outputs.reused != 'true'
        run: bash scripts/build_intel_dependencies.sh
      - name: Seal wheel against this commit and lockfile
        if: steps.restore.outputs.reused != 'true'
        env:
          SOURCE_REVISION: ${{ inputs.source-ref || github.sha }}
        run: |
          uv run --frozen --no-sync --no-build python scripts/intel_wheel.py seal "$RUNNER_TEMP/intel-wheel"
      - name: Verify the native library against the current build inputs
        run: |
          uv run --frozen --no-sync --no-build python scripts/intel_wheel.py prepare "$RUNNER_TEMP/intel-wheel"
      - name: Install only the checksummed wheel
        run: uv pip install --python .venv/bin/python --no-deps --no-build --require-hashes --requirement "$RUNNER_TEMP/intel-wheel/install.txt"
      - name: Exercise native algorithms, tamper rejection and static linkage
        run: uv run --frozen --no-sync --no-build python scripts/test_crypto.py
      - name: Record embedded OpenSSL for vulnerability scanning
        run: uv run --frozen --no-sync --no-build python scripts/intel_wheel.py sbom "$RUNNER_TEMP/intel-wheel"
      - name: Scan wheel components including embedded OpenSSL
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: ${{ runner.temp }}/intel-wheel/sbom.json
          version: v0.70.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/trivy-image.json
          hide-progress: 'true'
      - name: Print redacted wheel scan summary
        if: always()
        run: python3 scripts/security_report.py "$RUNNER_TEMP/trivy-image.json"
      - name: Install verified Grype for embedded OpenSSL CPE matching
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/grype.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_darwin_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            27eef17e42f0340af6582cdbc33ad18faf9f601c613ab81d2e1658a94cbc357f \
            "$archive" | shasum --algorithm 256 --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" grype
      - name: Scan embedded OpenSSL using its exact runtime CPE
        run: '"$RUNNER_TEMP/grype" "sbom:$RUNNER_TEMP/intel-wheel/sbom.json" --fail-on high --output json --file "$RUNNER_TEMP/grype-report.json"'
      - name: Print redacted embedded component scan summary
        if: always()
        run: python3 scripts/security_report.py "$RUNNER_TEMP/grype-report.json"
      - name: Retain verified wheel for tests and packaging in this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intel-cryptography-wheel
          path: |
            ${{ runner.temp }}/intel-wheel/*.whl
            ${{ runner.temp }}/intel-wheel/manifest.json
            ${{ runner.temp }}/intel-wheel/sbom.json
            ${{ runner.temp }}/intel-wheel/toolchain.txt
          if-no-files-found: error
          retention-days: 14
